name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Create pages directory
        run: |
          mkdir -p _site
          # The 2028-29 constituency estimates are the landing page; estimates_2028_29/
          # holds only the files the page links to.
          cp constituency_estimates_2028_29.html _site/
          mkdir -p _site/estimates_2028_29
          cp estimates_2028_29/constituency_estimates_2028_29.csv estimates_2028_29/estimates_2028_29_summary.json _site/estimates_2028_29/
          # Kept unchanged: PolicyEngine's November 2025 article embeds this map.
          cp surcharge_map_by_revenue.html _site/
          cp mansion_tax_map_1m.html _site/ 2>/dev/null || true
          cp mansion_tax_map_2m.html _site/ 2>/dev/null || true
          cp -r data _site/ 2>/dev/null || true
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=constituency_estimates_2028_29.html"></head></html>' > _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
